<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bairros</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <nav class="menu">
        <a th:href="@{/}" href="#">Início</a> |
        <a th:href="@{/bairros}" href="#">Bairros</a> |
        <a th:href="@{/trechos}" href="#">Trechos</a> |
        <a th:href="@{/leituras}" href="#">Leituras</a>
    </nav>

    <h1>Bairros</h1>

    <!-- mensagens enviadas pelo controller (RedirectAttributes.addFlashAttribute) -->
    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Bairro salvo com sucesso.</div>
    <div class="erro" th:if="${erro}" th:text="${erro}">O bairro tem trechos cadastrados e não pode ser excluído.</div>

    <a class="novo" th:href="@{/bairros/novo}" href="#">Novo bairro</a>

    <table class="lista">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Zona</th>
            <th class="numero">População</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bairro : ${bairros}">
            <td th:text="${bairro.nome}">Jardim das Águas</td>
            <td th:text="${bairro.zona}">Sul</td>
            <td class="numero" th:text="${#numbers.formatInteger(bairro.populacao, 1, 'POINT')}">18.400</td>
            <td class="acoes">
                <a th:href="@{/bairros/{id}/editar(id=${bairro.id})}" href="#">Editar</a>
                <form th:action="@{/bairros/{id}/excluir(id=${bairro.id})}" method="post">
                    <button type="submit" class="excluir">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(bairros)}">
            <td class="vazio" colspan="4">Nenhum bairro cadastrado.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
