<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leituras</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
<main>
    <nav class="menu">
        <a th:href="@{/}" href="#">Início</a> |
        <a th:href="@{/bairros}" href="#">Bairros</a> |
        <a th:href="@{/trechos}" href="#">Trechos</a> |
        <a th:href="@{/leituras}" href="#">Leituras</a>
    </nav>

    <h1>Leituras</h1>

    <div class="mensagem" th:if="${mensagem}" th:text="${mensagem}">Leitura salva com sucesso.</div>
    <div class="erro" th:if="${erro}" th:text="${erro}">Não foi possível concluir a operação.</div>

    <a class="novo" th:href="@{/leituras/novo}" href="#">Nova leitura</a>

    <table class="lista">
        <thead>
        <tr>
            <th>Data e hora</th>
            <th>Trecho</th>
            <th class="numero">Lâmina (cm)</th>
            <th>Situação</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leitura : ${leituras}">
            <td th:text="${#temporals.format(leitura.dataHora, 'dd/MM/yyyy HH:mm')}">01/11/2026 17:30</td>
            <td th:text="${leitura.trechoLogradouro}">Rua do Córrego</td>
            <td class="numero" th:text="${leitura.lamina}">18</td>
            <td>
                <!-- a situacao vem pronta do service (R1); aqui so escolhemos a cor -->
                <span class="status status-alerta"
                      th:class="${'status status-' + #strings.toLowerCase(leitura.situacao)}"
                      th:text="${leitura.situacao}">ALERTA</span>
            </td>
            <td class="acoes">
                <a th:href="@{/leituras/{id}/editar(id=${leitura.id})}" href="#">Editar</a>
                <form th:action="@{/leituras/{id}/excluir(id=${leitura.id})}" method="post">
                    <button type="submit" class="excluir">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(leituras)}">
            <td class="vazio" colspan="5">Nenhuma leitura cadastrada.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
