spring.application.name=pietro557000

# Oracle da FIAP
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Usuario e senha ficam fora do repositorio, no arquivo credenciais.txt
# (na pasta raiz do projeto), com as duas linhas:
#   spring.datasource.username=rm557000
#   spring.datasource.password=SUA_SENHA
spring.config.import=optional:file:./credenciais.txt[.properties]

# As tres tabelas (GS000_BAIRRO, GS000_TRECHO e GS000_LEITURA) sao criadas pelo JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
